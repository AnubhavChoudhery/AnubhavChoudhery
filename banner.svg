<svg width="1280" height="360" viewBox="0 0 1280 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Anubhav Choudhery - AI/ML, Systems, Web, Hardware</title>
  <desc id="desc">Custom developer profile banner with gradients, circuit motifs, and role highlights.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0B1021"/>
      <stop offset="0.52" stop-color="#111936"/>
      <stop offset="1" stop-color="#18254C"/>
    </linearGradient>

    <radialGradient id="glowLeft" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(240 100) rotate(35) scale(380 260)">
      <stop stop-color="#3B82F6" stop-opacity="0.40"/>
      <stop offset="1" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowRight" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1010 250) rotate(-20) scale(420 300)">
      <stop stop-color="#22D3EE" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#60A5FA"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>

    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <rect width="1280" height="360" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="360" rx="24" fill="url(#glowLeft)"/>
  <rect width="1280" height="360" rx="24" fill="url(#glowRight)"/>

  <g opacity="0.32" stroke="#93C5FD" stroke-width="1.5">
    <path d="M90 70H230L300 140H430"/>
    <path d="M130 290H260L330 220H470"/>
    <path d="M850 78H980L1060 148H1188"/>
    <path d="M810 292H950L1030 226H1170"/>
    <circle cx="90" cy="70" r="4" fill="#93C5FD"/>
    <circle cx="230" cy="70" r="4" fill="#93C5FD"/>
    <circle cx="300" cy="140" r="4" fill="#93C5FD"/>
    <circle cx="430" cy="140" r="4" fill="#93C5FD"/>
    <circle cx="130" cy="290" r="4" fill="#93C5FD"/>
    <circle cx="260" cy="290" r="4" fill="#93C5FD"/>
    <circle cx="330" cy="220" r="4" fill="#93C5FD"/>
    <circle cx="470" cy="220" r="4" fill="#93C5FD"/>
    <circle cx="850" cy="78" r="4" fill="#93C5FD"/>
    <circle cx="980" cy="78" r="4" fill="#93C5FD"/>
    <circle cx="1060" cy="148" r="4" fill="#93C5FD"/>
    <circle cx="1188" cy="148" r="4" fill="#93C5FD"/>
    <circle cx="810" cy="292" r="4" fill="#93C5FD"/>
    <circle cx="950" cy="292" r="4" fill="#93C5FD"/>
    <circle cx="1030" cy="226" r="4" fill="#93C5FD"/>
    <circle cx="1170" cy="226" r="4" fill="#93C5FD"/>
  </g>

  <g opacity="0.9">
    <rect x="72" y="96" width="6" height="172" rx="3" fill="url(#accent)"/>
    <rect x="74" y="160" width="330" height="2" fill="#60A5FA" opacity="0.45"/>
  </g>

  <g filter="url(#soft)" opacity="0.35">
    <ellipse cx="640" cy="320" rx="450" ry="30" fill="#0EA5E9"/>
  </g>

  <text x="102" y="146" fill="#E2E8F0" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="52" font-weight="700" letter-spacing="0.5">Anubhav Choudhery</text>
  <text x="104" y="188" fill="#93C5FD" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="600">AI/ML • Systems Engineering • Web Development • Hardware Design</text>
  <text x="104" y="232" fill="#BFDBFE" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="18" font-weight="500" opacity="0.95">Building intelligent systems that bridge software and hardware.</text>

  <g transform="translate(930 72)">
    <rect x="0" y="0" width="266" height="216" rx="18" fill="#0F172A" fill-opacity="0.55" stroke="#60A5FA" stroke-opacity="0.45"/>
    <text x="20" y="40" fill="#E2E8F0" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="18" font-weight="700">Focus Areas</text>

    <g fill="#BAE6FD" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="15" font-weight="600">
      <text x="20" y="74">• Machine Learning &amp; LLMs</text>
      <text x="20" y="102">• Distributed + Cloud Systems</text>
      <text x="20" y="130">• Full-Stack Product Engineering</text>
      <text x="20" y="158">• Embedded + VLSI Workflows</text>
      <text x="20" y="186">• Applied AI Tooling &amp; SDKs</text>
    </g>
  </g>

  <rect x="1" y="1" width="1278" height="358" rx="23" stroke="#93C5FD" stroke-opacity="0.22"/>
</svg>